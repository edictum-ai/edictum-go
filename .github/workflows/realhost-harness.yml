name: realhost-harness

# Maintainer-dispatched real-host harness skeleton (L0.4). Drives the
# installed Claude Code / Copilot CLI / OpenCode CLIs on a self-hosted
# runner and proves the run is trustworthy: hooks that do not run fail the
# run (scripts/realhost-harness.sh explains what this does and does not
# prove). Dispatch-only by design: the host carries real user credentials
# and real API quota, so nothing here may run on push or pull_request.
# Publishing stays GitHub-hosted; this workflow never publishes anything.
#
# Runner host (label: edictum-realhost) is a Mac on the maintainer's user
# account. The harness step sets the PATH entries the host needs:
#   ~/.local/bin                             claude
#   ~/.local/share/fnm/aliases/default/bin   node, npm, copilot (npm loader)
#   /opt/homebrew/bin                        opencode
# The fnm bin directory must precede /opt/homebrew/bin: the copilot CLI
# loader must run under the fnm node toolchain. On 2026-08-15 the Homebrew
# node (25.8.2) was itself unloadable (dyld: libsimdjson.31.dylib missing
# against simdjson 4.6.4), which aborted copilot with Abort trap: 6.
# Credentials are runner-local user accounts (Claude Code OAuth under
# ~/.claude, Copilot CLI auth under ~/.copilot, OpenCode auth under
# ~/.local/share/opencode/auth.json). No credentials live in this repo.

on:
  workflow_dispatch:
    inputs:
      break-hook:
        description: "Deliberately break every probe hook (the run must go red)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: realhost-harness
  cancel-in-progress: false

jobs:
  harness:
    runs-on: [self-hosted, edictum-realhost]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run real-host harness skeleton
        env:
          REALHOST_LOG_DIR: ${{ github.workspace }}/realhost-logs
          REALHOST_BREAK_HOOK: ${{ inputs.break-hook && '1' || '0' }}
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/fnm/aliases/default/bin:/opt/homebrew/bin:$PATH"
          bash ./scripts/realhost-harness.sh
      - name: Upload harness run log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: realhost-harness-log${{ inputs.break-hook && '-broken-hook' || '' }}
          path: realhost-logs/
